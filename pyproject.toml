[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantumlab"
version = "0.1.0"
description = "QuantumLab — production-grade квантовохимическая платформа: ядро, планировщик, GUI, CLI, Python/REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QuantumLab contributors" }]
keywords = ["quantum chemistry", "DFT", "Hartree-Fock", "HPC", "materials"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
  "openapi-spec-validator>=0.7",
  # Сервер покрыт тестами, поэтому его зависимости нужны и для `make check`.
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
]

[project.scripts]
quantumlab = "quantumlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumlab"]

# --------------------------------------------------------------------------- #
# Качество кода (требование §47 ТЗ): strict typing + lint + format + tests.
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_generics = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/quantumlab", "tests", "verification", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "ARG",      # unused args
  "PTH",      # pathlib
  "RUF",      # ruff-specific
  "ANN",      # annotations
  "D",        # pydocstyle
]
ignore = [
  "D203",  # конфликт с D211
  "D213",  # конфликт с D212
  # Русскоязычная кодовая база: «В», «с», «о» в строках/докстрингах — это
  # кириллица по замыслу, а не опечатка (§3 ТЗ). Правило даёт сотни
  # ложных срабатываний и отключено осознанно.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"docs/**" = ["ALL"]
# xc_spin_cores — механическая транскрипция C (maple2c) libxc: имена функций и
# аргументов, длина строк формул и докстринги — из исходного C-кода и меняться
# не должны (см. docstring модуля). Стилевые правила отключены, корректностные
# (F, B, W) — нет.
"src/quantumlab/engine/xc_spin_cores.py" = ["ANN", "ARG", "D", "E501", "N"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "scientific: научные regression-тесты (требуют расчётного ядра)",
  "benchmark: производительностные тесты",
  "slow: долгие тесты, не входят в быстрый прогон",
]

[tool.coverage.run]
source = ["src/quantumlab"]
branch = true
