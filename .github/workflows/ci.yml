name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests (fast set, without independent oracles)
        run: .venv/bin/python -m pytest -m "not slow"

  scientific:
    # Сверка с независимыми оракулами (PySCF/LibXC/libdftd4): долго, поэтому
    # отдельное задание, не блокирующее быструю обратную связь.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" pyscf pyscf-dispersion
      - name: Scientific cross-checks and verification suite
        run: |
          .venv/bin/python -m pytest -m scientific
          make verify
