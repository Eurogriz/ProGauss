id: water-rhf-sto3g-geometry-internal
level: L5
slow: true  # измерено: > 10 c на кейс
description: Оптимизированная геометрия воды RHF/STO-3G (избыточные внутренние координаты) против минимума, найденного PySCF независимо.
molecule: tests/fixtures/water.xyz
spec:
  task: optimization
  method: { theory: hf, basis: sto-3g }
  optimization: { coordinates: redundant_internal, max_steps: 40 }
expect:
  energy_hartree:
    value: -74.9659011923
    tol: 1.0e-7
    source: PySCF 2.14 RHF/STO-3G, симплекс-поиск минимума по (r, θ), conv_tol 1e-12
bond_lengths_angstrom:
  - { atoms: [0, 1], value: 0.98940912, tol: 5.0e-4 }
  - { atoms: [0, 2], value: 0.98940912, tol: 5.0e-4 }
angles_degrees:
  - { atoms: [1, 0, 2], value: 100.026876, tol: 0.05 }
quality:
  optimization_converged: true
  scf_converged: true
