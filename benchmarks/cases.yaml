# Наборы бенчмарков (§27 ТЗ, проект — docs/architecture/09).
#
# Состав наборов — по числу атомов, как в проекте. Кейс с `blocked_reason`
# не измеряется: причина всегда конкретна и измерена, а не «потом сделаем».

cases:
  - id: hydrogen-rhf-sto3g-sp
    suite: small
    molecule: tests/fixtures/hydrogen.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: sto-3g }
    runs: 5
    warmup: 1

  - id: water-rhf-sto3g-sp
    suite: small
    molecule: tests/fixtures/water.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: sto-3g }
    runs: 5
    warmup: 1

  - id: water-rhf-sto3g-grad
    suite: small
    molecule: tests/fixtures/water.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: sto-3g }
    measure_gradient: true
    runs: 3
    warmup: 1

  # ROHF-градиент радикала CH: фиксация стоимости фокиан-зависимых весов
  # релаксации (базовый ERI + сборка Fc/F^α/F^β) против RHF-градиента.
  - id: ch-rohf-sto3g-grad
    suite: small
    molecule: tests/fixtures/ch-radical.xyz
    multiplicity: 2
    spec:
      task: single_point
      method: { theory: hf, basis: sto-3g, spin: rohf }
    measure_gradient: true
    runs: 3
    warmup: 1

  - id: water-rhf-631g-sp
    suite: small
    molecule: tests/fixtures/water.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: 6-31g }
    runs: 3
    warmup: 1

  # DFT-D3 (BJ) поверх RHF: кейс фиксирует стоимость поправки в реестре —
  # она обязана оставаться пренебрежимо малой против SCF (O(N²) по парам
  # против O(N³) по базису).
  - id: water-rhf-sto3g-sp-d3bj
    suite: small
    molecule: tests/fixtures/water.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: sto-3g, dispersion: d3bj }
    runs: 5
    warmup: 1

  - id: water-rhf-sto3g-opt
    suite: small
    molecule: tests/fixtures/water.xyz
    spec:
      task: optimization
      method: { theory: hf, basis: sto-3g }
      optimization: { coordinates: cartesian, max_steps: 40 }
    runs: 3
    warmup: 1

  # UKS-точка радикала CH: фиксирует стоимость спиново-поляризованного DFT —
  # два канала SCF + GGA-сетка (∇ρ^α, ∇ρ^β, σ), путь, которого нет у RKS.
  # Градиент здесь не измеряется: ветвь measure_gradient пока знает только HF.
  # Ставится ПОСЛЕДНИМ в наборе: пиковая память DFT-сетки (~370 МБ) выше, чем у
  # всех HF-кейсов, а пик в отчёте — монотонный максимум по потомкам (см. README);
  # иначе его память приписалась бы кейсам, идущим после.
  - id: ch-uks-pbe-sto3g-sp
    suite: small
    molecule: tests/fixtures/ch-radical.xyz
    multiplicity: 2
    spec:
      task: single_point
      method: { theory: dft, basis: sto-3g, functional: pbe, spin: uhf }
      grid: { preset: fine }
    runs: 3
    warmup: 1

  - id: water-rhf-ccpvdz-sp
    suite: medium
    molecule: tests/fixtures/water.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: cc-pvdz }
    runs: 3
    warmup: 1

  - id: benzene-rhf-631g-sp
    suite: medium
    molecule: tests/fixtures/benzene.xyz
    spec:
      task: single_point
      method: { theory: hf, basis: 6-31g }
    runs: 3
    warmup: 1
